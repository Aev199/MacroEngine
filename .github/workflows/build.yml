name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MacroEngine.Tests/MacroEngine.Tests.csproj

      - name: Test
        run: dotnet test MacroEngine.Tests/MacroEngine.Tests.csproj -c Release --no-restore

      - name: Build
        run: dotnet build MacroEngine/MacroEngine.csproj -c Release --no-restore

      - name: Publish win-x64
        run: >-
          dotnet publish MacroEngine/MacroEngine.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/win-x64

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MacroEngine-win-x64
          path: artifacts/win-x64/

  integration:
    if: github.event_name == 'pull_request' && github.head_ref == 'claude/festive-lamport-g4qh0t'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/festive-lamport-g4qh0t

      - name: Rebuild integration branch on master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master claude/festive-lamport-g4qh0t release/avalonia-hardening
          git checkout -B release/avalonia-hardening origin/master
          git rm -r --ignore-unmatch .
          git checkout origin/claude/festive-lamport-g4qh0t -- .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Avalonia UI and reliability hardening"
          git push --force origin HEAD:release/avalonia-hardening
