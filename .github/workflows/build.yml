name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MacroEngine.Tests/MacroEngine.Tests.csproj

      - name: Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-results | Out-Null
          dotnet test MacroEngine.Tests/MacroEngine.Tests.csproj -c Release --no-restore `
            --logger "trx;LogFileName=test-results.trx" `
            --results-directory artifacts/test-results 2>&1 `
            | Tee-Object -FilePath artifacts/test-results/console.txt
          $exitCode = $LASTEXITCODE
          exit $exitCode

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MacroEngine-test-diagnostics
          path: artifacts/test-results/
          if-no-files-found: ignore

      - name: Build
        run: dotnet build MacroEngine/MacroEngine.csproj -c Release --no-restore

      - name: Publish win-x64
        run: >-
          dotnet publish MacroEngine/MacroEngine.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/win-x64

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MacroEngine-win-x64
          path: artifacts/win-x64/
