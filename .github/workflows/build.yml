name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.product.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MacroEngine.Tests/MacroEngine.Tests.csproj

      - name: Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-results | Out-Null
          dotnet test MacroEngine.Tests/MacroEngine.Tests.csproj -c Release --no-restore `
            --logger "trx;LogFileName=test-results.trx" `
            --results-directory artifacts/test-results 2>&1 `
            | Tee-Object -FilePath artifacts/test-results/console.txt
          $exitCode = $LASTEXITCODE
          exit $exitCode

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MacroEngine-test-diagnostics
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Build
        run: dotnet build MacroEngine/MacroEngine.csproj -c Release --no-restore

      - name: Publish win-x64
        run: >-
          dotnet publish MacroEngine/MacroEngine.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/win-x64

      - name: Read product version
        id: product
        shell: pwsh
        run: |
          $project = Get-Content MacroEngine/MacroEngine.csproj -Raw
          $match = [regex]::Match($project, '<Version>([^<]+)</Version>')
          if (-not $match.Success) {
            throw 'Version was not found in MacroEngine.csproj.'
          }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Upload ready Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MacroEngine-${{ steps.product.outputs.version }}-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  # A "v<version>" tag publishes a GitHub Release with the package and its checksum.
  # The in-app updater looks for exactly these two assets.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.windows.outputs.version }}

    steps:
      - name: Check tag matches project version
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match <Version>$VERSION</Version> in MacroEngine.csproj"
            exit 1
          fi

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: MacroEngine-${{ needs.windows.outputs.version }}-win-x64
          path: package

      - name: Zip and checksum
        run: |
          PKG="MacroEngine-${VERSION}-win-x64.zip"
          test -f package/MacroEngine.exe
          (cd package && zip -r -9 "../$PKG" .)
          sha256sum "$PKG" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" "MacroEngine-${VERSION}-win-x64.zip" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "MacroEngine $VERSION" \
            --generate-notes $flags
