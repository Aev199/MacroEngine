name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish v<Version> from this commit (creates the tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.product.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MacroEngine.Tests/MacroEngine.Tests.csproj

      - name: Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-results | Out-Null
          dotnet test MacroEngine.Tests/MacroEngine.Tests.csproj -c Release --no-restore `
            --logger "trx;LogFileName=test-results.trx" `
            --results-directory artifacts/test-results 2>&1 `
            | Tee-Object -FilePath artifacts/test-results/console.txt
          $exitCode = $LASTEXITCODE
          exit $exitCode

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MacroEngine-test-diagnostics
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Build
        run: dotnet build MacroEngine/MacroEngine.csproj -c Release --no-restore

      - name: Publish win-x64
        run: >-
          dotnet publish MacroEngine/MacroEngine.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/win-x64

      - name: Read product version
        id: product
        shell: pwsh
        run: |
          $project = Get-Content MacroEngine/MacroEngine.csproj -Raw
          $match = [regex]::Match($project, '<Version>([^<]+)</Version>')
          if (-not $match.Success) {
            throw 'Version was not found in MacroEngine.csproj.'
          }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Upload ready Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MacroEngine-${{ steps.product.outputs.version }}-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  # Publishes a GitHub Release with the package and its checksum — the in-app
  # updater looks for exactly these two assets. Either push a "v<Version>" tag,
  # or run this workflow on master with "publish_release" (the release then
  # creates the tag on that commit).
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.windows.outputs.version }}

    steps:
      - name: Resolve tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag $TAG does not match <Version>$VERSION</Version> in MacroEngine.csproj"
              exit 1
            fi
          else
            TAG="v$VERSION"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG already exists — bump <Version> in MacroEngine.csproj first"
              exit 1
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: MacroEngine-${{ needs.windows.outputs.version }}-win-x64
          path: package

      - name: Zip and checksum
        run: |
          PKG="MacroEngine-${VERSION}-win-x64.zip"
          test -f package/MacroEngine.exe
          (cd package && zip -r -9 "../$PKG" .)
          sha256sum "$PKG" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" "MacroEngine-${VERSION}-win-x64.zip" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MacroEngine $VERSION" \
            --generate-notes $flags
