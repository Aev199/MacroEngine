name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MacroEngine/MacroEngine.csproj

      - name: Build
        run: dotnet build MacroEngine/MacroEngine.csproj -c Release --no-restore

      - name: Publish win-x64
        run: >-
          dotnet publish MacroEngine/MacroEngine.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/win-x64

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MacroEngine-win-x64
          path: artifacts/win-x64/
