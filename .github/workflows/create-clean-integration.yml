name: Create clean integration branch

on:
  push:
    branches:
      - claude/festive-lamport-g4qh0t
    paths:
      - .github/workflows/create-clean-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/festive-lamport-g4qh0t

      - name: Rebuild branch on current master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master claude/festive-lamport-g4qh0t release/avalonia-hardening
          git checkout -B release/avalonia-hardening origin/master
          git rm -r --ignore-unmatch .
          git checkout origin/claude/festive-lamport-g4qh0t -- .
          git rm --ignore-unmatch .github/workflows/create-clean-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Avalonia UI and reliability hardening"
          git push origin HEAD:release/avalonia-hardening --force-with-lease
